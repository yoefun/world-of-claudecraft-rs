[workspace]
resolver = "2"
members = [
    "crates/woc-version",
    "crates/woc-protocol",
    "crates/woc-content",
    "crates/woc-sim",
    "crates/woc-manufacturing",
    "crates/woc-persist",
    "crates/woc-server",
    "crates/woc-client",
    "crates/woc-update",
]
default-members = [
    "crates/woc-version",
    "crates/woc-protocol",
    "crates/woc-content",
    "crates/woc-sim",
    "crates/woc-persist",
    "crates/woc-server",
    "crates/woc-client",
    "crates/woc-update",
]

[workspace.package]
version = "1.13.0"
edition = "2021"
license = "MIT"
authors = ["World of ClaudeCraft Rust rewrite contributors"]
repository = "https://github.com/yoefun/world-of-claudecraft-rs"
description = "Rust rewrite of World of ClaudeCraft"

[workspace.dependencies]
woc-version = { path = "crates/woc-version" }
woc-protocol = { path = "crates/woc-protocol" }
woc-content = { path = "crates/woc-content" }
woc-sim = { path = "crates/woc-sim" }
woc-manufacturing = { path = "crates/woc-manufacturing" }
woc-persist = { path = "crates/woc-persist" }
woc-update = { path = "crates/woc-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy = { version = "0.16", default-features = true }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
argon2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
