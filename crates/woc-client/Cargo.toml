[package]
name = "woc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy offline/online host for World of ClaudeCraft (Rust) combat slice"

[[bin]]
name = "woc-client"
path = "src/main.rs"

[dependencies]
woc-version = { workspace = true }
woc-protocol = { workspace = true }
woc-sim = { workspace = true }
woc-content = { workspace = true }
bevy = { workspace = true, features = ["webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
