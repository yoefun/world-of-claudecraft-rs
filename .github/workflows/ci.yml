name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Linux deps for Bevy check
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (no GPU client)
        run: cargo clippy --workspace --exclude woc-client -- -D warnings
      - name: test (no GPU client)
        run: cargo test --workspace --exclude woc-client
      - name: build server
        run: cargo build -p woc-server
      - name: check client compiles
        run: cargo check -p woc-client
